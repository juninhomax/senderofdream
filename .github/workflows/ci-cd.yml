name: CI/CD Pipeline - Build & Push Docker Image

on:
  push:
    branches:
      - cicd-integration
      - refactor-architecture
  pull_request:
    branches:
      - cicd-integration
      - refactor-architecture
  workflow_dispatch:  # Allow manual trigger from deploy.sh

env:
  REGISTRY: acrstg10tf.azurecr.io
  IMAGE_NAME: sample-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Tag image with commit SHA
      run: |
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Azure CLI Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Verify image pushed
      run: |
        az acr repository show --name acrstg10tf --repository ${{ env.IMAGE_NAME }} --output table
