name: CI/CD Pipeline

on:
  push:
    branches:
      - refactor-architecture
      - fix-cicd-auto-deploy
      - clean-final-version
  pull_request:
    branches:
      - refactor-architecture
      - fix-cicd-auto-deploy
      - clean-final-version
  workflow_dispatch:  # Allow manual trigger from deploy.sh

env:
  REGISTRY: acrstg10tf.azurecr.io
  IMAGE_NAME: sample-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get ACR credentials directly from Azure
      id: acr-creds
      run: |
        ACR_USERNAME=$(az acr credential show --name acrstg10tf --query "username" -o tsv)
        ACR_PASSWORD=$(az acr credential show --name acrstg10tf --query "passwords[0].value" -o tsv)
        echo "::add-mask::$ACR_PASSWORD"
        echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
        echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ steps.acr-creds.outputs.acr_username }}
        password: ${{ steps.acr-creds.outputs.acr_password }}

    - name: Build Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Trigger App Service deployment
      run: |
        echo "🔄 Checking if App Service exists..."
        
        # Check if App Service exists before trying to restart it
        if az webapp show --name app-stg10-tf --resource-group rg-stg_10 > /dev/null 2>&1; then
          echo "✅ App Service found - Triggering deployment..."
          az webapp restart --name app-stg10-tf --resource-group rg-stg_10
          
          # Wait a moment for restart
          sleep 15
          
          # Force container refresh by updating a dummy app setting
          TIMESTAMP=$(date +%s)
          az webapp config appsettings set --name app-stg10-tf --resource-group rg-stg_10 --settings "LAST_DEPLOY_TIME=$TIMESTAMP"
          
          echo "✅ App Service deployment triggered!"
        else
          echo "⚠️ App Service not found - Skipping deployment trigger"
          echo "💡 This is normal if infrastructure hasn't been deployed yet"
          echo "🚀 Image has been pushed to ACR and is ready for deployment"
        fi
